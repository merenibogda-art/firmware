name: Apply and Build Liviu S3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply_and_build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
      - name: Create separate branch and apply S3 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, json, zlib
          from pathlib import Path
          data = json.loads(zlib.decompress(base64.b64decode("")))
          router = Path("boards/pinouts/pins_arduino.h")
          old = router.read_text()
          marker = '#ifdef T_DISPLAY_S3\n#include "../lilygo-t-display-s3/pins_arduino.h"'
          insert = '#if defined(LIVIU_S3_N16R8)\n#include "../Liviu-S3/pins_arduino.h"\n#elif defined(T_DISPLAY_S3)\n#include "../lilygo-t-display-s3/pins_arduino.h"'
          if 'LIVIU_S3_N16R8' not in old:
              if marker not in old:
                  raise SystemExit("Unexpected pin router. No files changed; inspect upstream changes.")
              router.write_text(old.replace(marker, insert, 1))
          for filename, content in data.items():
              p = Path(filename)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)
          print("Applied dedicated S3 profile. Existing C5 profiles were not changed.")
          PYCODE
          python3 tools/check_liviu_s3.py
          branch="liviu-s3-fix-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boards/Liviu-S3 boards/_boards_json/liviu-s3-n16r8.json boards/pinouts/pins_arduino.h tools/check_liviu_s3.py
          if ! git diff --cached --quiet; then
            git commit -m "Add dedicated Liviu S3 N16R8 ST7789 board profile"
          fi
          git push origin "HEAD:refs/heads/$branch"
          echo "### S3 source changes saved" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: $branch. Main was not modified by this run." >> "$GITHUB_STEP_SUMMARY"
          echo "Compilation and physical hardware checks are separate." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib
          python -m pip install platformio==6.1.19 requests intelhex esptool
      - name: Build S3 firmware
        shell: bash
        run: |
          set -o pipefail
          python -m platformio run -e liviu-s3-n16r8 -j 4 2>&1 | tee build-liviu-s3.log
          test -s Bruce-liviu-s3-n16r8.bin
          sha256sum Bruce-liviu-s3-n16r8.bin > SHA256SUMS-liviu-s3.txt
      - name: Save firmware and matching ELF
        uses: actions/upload-artifact@v4
        with:
          name: Bruce-liviu-s3-n16r8
          retention-days: 14
          if-no-files-found: error
          path: |
            Bruce-liviu-s3-n16r8.bin
            SHA256SUMS-liviu-s3.txt
            .pio/build/liviu-s3-n16r8/firmware.elf
            .pio/build/liviu-s3-n16r8/partitions.bin
      - name: Save build log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Liviu-S3-build-log
          retention-days: 14
          if-no-files-found: ignore
          path: build-liviu-s3.log
          
